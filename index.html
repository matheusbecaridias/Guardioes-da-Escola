<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="/favicon.png">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Guardiões da Escola</title>
    <style>
      @font-face {
        font-family: "Pixelify Sans";
        src: url("./assets/fonts/PixelifySans-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        background: #08111f;
        color: #ffffff;
        font-family: "Pixelify Sans", Arial, Helvetica, sans-serif;
        font-weight: 700;
      }

      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #08111f;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* Desktop ou Mobile já deitado (Paisagem) */
      #game-container canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        touch-action: none;
      }

      /* CELULAR EM PÉ (Retrato forçado a deitar) */
      @media screen and (orientation: portrait) {
        #game-container {
          position: fixed !important;
          top: 0 !important;
          left: 0 !important;
          width: 100vh !important;
          width: 100dvh !important;
          height: 100vw !important;
          height: 100dvw !important;
          transform-origin: top left !important;
          transform: translateX(100vw) rotate(90deg) !important;
        }

        /* Força o canvas a esticar no container rotacionado ignorando o inline style do Phaser */
        #game-container canvas {
          width: 100% !important;
          height: 100% !important;
          max-width: 100% !important;
          max-height: 100% !important;
          object-fit: contain !important;
        }
      }

      #profile-name-input::placeholder {
        font-family: "Pixelify Sans", Arial, Helvetica, sans-serif;
        font-weight: 700;
        color: #d6e3d8;
        opacity: 1;
      }

      #profile-name-input:focus {
        border-color: #f2c66d !important;
        box-shadow:
          0 4px 0 rgba(54, 29, 15, 0.9),
          inset 0 0 0 2px rgba(255, 255, 255, 0.12) !important;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
